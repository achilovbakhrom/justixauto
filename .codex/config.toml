# Project scoped; does not alter personal Codex settings or permissions.
# Primary session is the application/delivery hub. Defaults are for untyped leaves.
model = "gpt-6-astra"
model_reasoning_effort = "max"
[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
interrupt_message = true
