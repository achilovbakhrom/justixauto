{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "justixauto.name" . }}
  labels: {{- include "justixauto.labels" . | nindent 4 }}
  annotations:
    # Uploads are limited by the API (10 MB); allow them through the proxy.
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
    {{- with .Values.ingress.annotations }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ include "justixauto.name" . }}, port: { name: http } }
{{- end }}
