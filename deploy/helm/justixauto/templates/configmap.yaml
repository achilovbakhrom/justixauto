{{- include "justixauto.guards" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "justixauto.name" . }}
  labels: {{- include "justixauto.labels" . | nindent 4 }}
data:
  HTTP_ADDR: ":8080"
  COOKIE_SECURE: {{ .Values.config.cookieSecure | quote }}
  ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
  SHUTDOWN_DRAIN: {{ .Values.config.shutdownDrain | quote }}
  MFA_DISABLED: {{ .Values.config.mfaDisabled | quote }}
  WEB_DIR: {{ .Values.config.webDir | quote }}
  FILE_STORAGE: {{ .Values.config.fileStorage | quote }}
  S3_BUCKET: {{ .Values.config.s3.bucket | quote }}
  S3_REGION: {{ .Values.config.s3.region | quote }}
  S3_PREFIX: {{ .Values.config.s3.prefix | quote }}
  S3_ENDPOINT: {{ .Values.config.s3.endpoint | quote }}
  S3_FORCE_PATH_STYLE: {{ .Values.config.s3.forcePathStyle | quote }}
  S3_SSE: {{ .Values.config.s3.sse | quote }}
  {{- with .Values.config.otel.endpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  {{- end }}
  OTEL_SERVICE_NAME: {{ .Values.config.otel.serviceName | quote }}
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: {{ .Values.config.otel.traceSampleRatio | quote }}
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment={{ .Values.environment }}"
