## Imported topology is immutable at runtime for service callers. Passwords are
## provisioned by the local runtime from injected secrets; definitions contain
## disabled-by-default service principals only.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
definitions.skip_if_unchanged = true

## The guest account is absent from definitions and must never be recreated for
## remote use. Network publication remains the responsibility of local Compose.
loopback_users.guest = true

## Management is retained for local diagnostics. The shared Compose task must
## publish this port on loopback only, if it publishes it at all.
management.tcp.port = 15672

log.console = true
log.console.level = info
