# Local development database. Usage (from the repo root):
#   cp .env.example .env && docker compose --env-file .env -f infra/local/compose.yaml up -d
name: justixauto
services:
  postgres:
    image: docker.io/library/postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: justixauto
      POSTGRES_USER: justixauto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "justixauto", "-d", "justixauto"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
