# Backing services for the local cluster only: PostgreSQL and MinIO (S3).
apiVersion: v1
kind: Namespace
metadata: { name: justixauto-deps }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: justixauto-deps }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: justixauto-deps }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          env:
            - { name: POSTGRES_DB, value: justixauto }
            - { name: POSTGRES_USER, value: justixauto }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: deps-secrets, key: POSTGRES_PASSWORD } }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "justixauto", "-d", "justixauto", "-h", "127.0.0.1"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: justixauto-deps }
spec:
  selector: { app: minio }
  ports: [{ name: s3, port: 9000, targetPort: 9000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: justixauto-deps }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          # Loaded from the local Docker image by infra/kind/up.sh (public MinIO images are no longer published).
          image: minio/minio:latest
          imagePullPolicy: Never
          command: ["sh", "-c", "mkdir -p /data/justixauto-documents && exec minio server /data"]
          env:
            - { name: MINIO_ROOT_USER, value: justixauto }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: deps-secrets, key: MINIO_ROOT_PASSWORD } }
          ports: [{ containerPort: 9000 }]
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, emptyDir: {} }]
