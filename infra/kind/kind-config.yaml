# Local cluster for JustixAuto (context: kind-justixauto).
# NodePorts: 30080 → app on http://localhost:18090, 30300 → Grafana on http://localhost:13000.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: justixauto
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 18090, listenAddress: "127.0.0.1" }
      - { containerPort: 30300, hostPort: 13000, listenAddress: "127.0.0.1" }
