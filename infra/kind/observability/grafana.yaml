# grafana/grafana 10.5.15 — datasources linked both ways (logs ↔ traces) and
# a JustixAuto API dashboard. http://localhost:13000 (admin / see up.sh output).
admin: { existingSecret: grafana-admin, userKey: admin-user, passwordKey: admin-password }
service: { type: NodePort, nodePort: 30300 }
resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 384Mi } }
persistence: { enabled: false }
testFramework: { enabled: false }
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus-server.observability
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        url: http://loki.observability:3100
        jsonData:
          derivedFields:
            - { name: trace_id, matcherType: regex, matcherRegex: '"trace_id":"(\w+)"', url: "$${__value.raw}", datasourceUid: tempo }
      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo.observability:3200
        jsonData:
          tracesToLogsV2: { datasourceUid: loki, filterByTraceID: true, spanStartTimeShift: "-5m", spanEndTimeShift: "5m", customQuery: true,
            query: '{k8s_namespace_name="justixauto"} |= "$${__span.traceId}"' }
          serviceMap: { datasourceUid: prometheus }
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - { name: justixauto, folder: JustixAuto, type: file, options: { path: /var/lib/grafana/dashboards/justixauto } }
dashboardsConfigMaps:
  justixauto: grafana-dashboard-justixauto
