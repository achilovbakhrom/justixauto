apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-justixauto
  namespace: observability
data:
  justixauto-api.json: |
    {
      "uid": "justixauto-api",
      "title": "JustixAuto API",
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "schemaVersion": 39,
      "panels": [
        { "type": "timeseries", "title": "Requests per second by replica", "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum by (instance) (rate(http_server_request_duration_seconds_count{job=~\".*justixauto-api\"}[1m]))", "legendFormat": "{{instance}}" }] },
        { "type": "timeseries", "title": "5xx share", "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 }, "fieldConfig": { "defaults": { "unit": "percentunit" } },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(rate(http_server_request_duration_seconds_count{job=~\".*justixauto-api\",http_response_status_code=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_request_duration_seconds_count{job=~\".*justixauto-api\"}[5m])), 1e-9)", "legendFormat": "5xx" }] },
        { "type": "timeseries", "title": "p95 latency by route", "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 }, "fieldConfig": { "defaults": { "unit": "s" } },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "histogram_quantile(0.95, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket{job=~\".*justixauto-api\"}[5m])))", "legendFormat": "{{http_route}}" }] },
        { "type": "timeseries", "title": "Requests per second by route", "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "topk(10, sum by (http_route) (rate(http_server_request_duration_seconds_count{job=~\".*justixauto-api\"}[5m])))", "legendFormat": "{{http_route}}" }] },
        { "type": "logs", "title": "API logs (click trace_id to open the trace)", "gridPos": { "x": 0, "y": 16, "w": 24, "h": 12 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [{ "expr": "{k8s_namespace_name=\"justixauto\"}" }],
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending" } }
      ]
    }
