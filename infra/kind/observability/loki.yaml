# grafana/loki 7.3.0 — single binary, filesystem storage, no auth (local only).
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig: { replication_factor: 1 }
  storage: { type: filesystem }
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: loki_index_, period: 24h }
  limits_config:
    allow_structured_metadata: true   # OTLP attributes (trace_id, pod…) as structured metadata
    retention_period: 72h
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    per_stream_rate_limit: 8MB
    per_stream_rate_limit_burst: 16MB
  server:
    grpc_server_max_recv_msg_size: 16777216
    grpc_server_max_send_msg_size: 16777216
  pattern_ingester: { enabled: false }
singleBinary:
  replicas: 1
  resources: { requests: { cpu: 50m, memory: 192Mi }, limits: { memory: 512Mi } }
  persistence: { enabled: false }
  extraVolumes: [{ name: data, emptyDir: {} }]
  extraVolumeMounts: [{ name: data, mountPath: /var/loki }]
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
