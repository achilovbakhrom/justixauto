# open-telemetry/opentelemetry-collector 0.173.1 — one collector per node:
# OTLP from the API (traces, metrics) and stdout of every pod (logs).
fullnameOverride: otel-collector
mode: daemonset
image: { repository: otel/opentelemetry-collector-contrib }
presets:
  logsCollection: { enabled: true, includeCollectorLogs: false }
  kubernetesAttributes: { enabled: true }
service: { enabled: true }
resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 384Mi } }
config:
  processors:
    batch: { send_batch_size: 512, send_batch_max_size: 1024 }
    memory_limiter: { check_interval: 5s, limit_percentage: 80, spike_limit_percentage: 25 }
    # Pod stdout has no service name; use the app label so Loki can index it.
    resource/service:
      attributes:
        - { key: service.name, from_attribute: k8s.deployment.name, action: insert }
  exporters:
    otlphttp/loki: { endpoint: http://loki.observability:3100/otlp }
    otlp/tempo: { endpoint: tempo.observability:4317, tls: { insecure: true } }
    # Resource attributes stay in target_info (join on job/instance); copying
    # them onto every series multiplied the series count by pod churn.
    prometheus_remote_write:
      endpoint: http://prometheus-server.observability/api/v1/write
  service:
    pipelines:
      traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/tempo] }
      metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheus_remote_write] }
      logs: { receivers: [otlp], processors: [memory_limiter, k8sattributes, resource/service, batch], exporters: [otlphttp/loki] }
