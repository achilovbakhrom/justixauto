name: Build Push Deploy Justix Auto Dev

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: justix-auto-dev
  cancel-in-progress: true

env:
  DOCKER_USERNAME: poirot92
  IMAGE_NAME: justix-auto

jobs:

  deploy:
    name: Build, Migrate and Deploy

    runs-on:
      group: jlearnx runner
      labels: [self-hosted, docker, jlearnx]

    timeout-minutes: 20

    steps:

      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false


      # ---------------------------------------------------------
      # RUNNER INFO
      # ---------------------------------------------------------

      - name: Show runner information
        run: |
          echo "=== Runner ==="
          hostname

          echo "=== Commit ==="
          git rev-parse HEAD

          echo "=== Docker ==="
          docker version --format '{{.Server.Version}}'


      # ---------------------------------------------------------
      # DOCKER HUB LOGIN
      # ---------------------------------------------------------

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            docker login \
              -u "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin


      # ---------------------------------------------------------
      # BUILD
      # ---------------------------------------------------------

      - name: Build Justix Auto
        run: |
          docker build \
            --build-arg VERSION="${{ github.sha }}" \
            --label "com.justix.project=justix-auto" \
            -t "$DOCKER_USERNAME/$IMAGE_NAME:${{ github.sha }}" \
            .


      # ---------------------------------------------------------
      # PUSH
      # ---------------------------------------------------------

      - name: Push Justix Auto
        run: |
          docker push \
            "$DOCKER_USERNAME/$IMAGE_NAME:${{ github.sha }}"


      # ---------------------------------------------------------
      # CREATE TEMPORARY ENV
      # ---------------------------------------------------------

      - name: Create deployment environment
        run: |
          cat > "$GITHUB_WORKSPACE/.env" << EOF
          IMAGE_TAG=${{ github.sha }}

          DATABASE_URL=postgres://${{ secrets.JUSTIX_AUTO_DB_USER }}:${{ secrets.JUSTIX_AUTO_DB_PASSWORD }}@${{ secrets.JUSTIX_AUTO_DB_HOST }}:${{ secrets.JUSTIX_AUTO_DB_PORT }}/${{ secrets.JUSTIX_AUTO_DB_NAME }}?sslmode=disable

          HTTP_ADDR=:8080
          COOKIE_SECURE=${{ secrets.JUSTIX_AUTO_COOKIE_SECURE }}
          ALLOWED_ORIGINS=${{ secrets.JUSTIX_AUTO_ALLOWED_ORIGINS }}

          WEB_DIR=web/apps
          API_DOCS=${{ secrets.JUSTIX_AUTO_API_DOCS }}

          FILE_STORAGE=${{ secrets.JUSTIX_AUTO_FILE_STORAGE }}
          DOCUMENTS_DIR=var/documents
          EOF

          chmod 600 "$GITHUB_WORKSPACE/.env"


      # ---------------------------------------------------------
      # VALIDATE COMPOSE
      # ---------------------------------------------------------

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet

          echo "Justix Auto compose: OK"


      # ---------------------------------------------------------
      # PULL EXACT IMAGE
      # ---------------------------------------------------------

      - name: Pull Justix Auto image
        run: |
          docker compose pull api migrate


      # ---------------------------------------------------------
      # DATABASE MIGRATION
      # ---------------------------------------------------------

      - name: Run database migrations
        run: |
          docker compose run --rm migrate


      # ---------------------------------------------------------
      # DEPLOY
      # ---------------------------------------------------------

      - name: Deploy Justix Auto
        run: |
          docker compose up -d \
            --remove-orphans \
            --force-recreate \
            api

          docker compose ps


      # ---------------------------------------------------------
      # HEALTH CHECK
      # ---------------------------------------------------------

      - name: Health check
        run: |
          echo "Waiting for Justix Auto..."

          HOST_IP=$(ip route | awk '/default/ {print $3; exit}')

          echo "Docker host: $HOST_IP"

          for i in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 3 \
              "http://${HOST_IP}:2047/healthz"
            then
              echo
              echo "Justix Auto is healthy"
              exit 0
            fi

            sleep 2
          done

          echo "Health check failed"

          docker compose ps

          docker compose logs \
            --tail=150 \
            api

          exit 1


      # ---------------------------------------------------------
      # STATUS
      # ---------------------------------------------------------

      - name: Show container status
        run: |
          docker ps \
            --filter "name=justix-auto" \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"


      # ---------------------------------------------------------
      # CLEANUP LOCAL JUSTIX AUTO IMAGES
      # ---------------------------------------------------------

      - name: Cleanup local Justix Auto images
        run: |
          echo "Cleaning unused Justix Auto images..."

          docker image prune \
            -af \
            --filter "label=com.justix.project=justix-auto"

          echo "Local Justix Auto cleanup completed."


      # ---------------------------------------------------------
      # CLEANUP OLD DOCKER HUB TAGS
      # Keep latest 5 SHA tags
      # ---------------------------------------------------------

      - name: Cleanup old Docker Hub images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Cleaning old Docker Hub tags..."

          TOKEN=$(
            curl \
              --fail \
              --silent \
              --show-error \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
              https://hub.docker.com/v2/users/login/ \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])'
          )

          TAGS_JSON=$(
            curl \
              --fail \
              --silent \
              --show-error \
              --header "Authorization: Bearer ${TOKEN}" \
              --header "Accept: application/json" \
              "https://hub.docker.com/v2/namespaces/${DOCKERHUB_USERNAME}/repositories/${IMAGE_NAME}/tags?page_size=100"
          )

          OLD_TAGS=$(
            echo "$TAGS_JSON" | python3 -c '
          import sys
          import json

          data = json.load(sys.stdin)

          tags = [
              tag
              for tag in data.get("results", [])
              if tag.get("name") != "latest"
          ]

          tags.sort(
              key=lambda tag: tag.get("last_updated", ""),
              reverse=True
          )

          for tag in tags[5:]:
              print(tag["name"])
          '
          )

          if [ -z "$OLD_TAGS" ]; then
            echo "Nothing to delete. 5 or fewer SHA tags exist."
            exit 0
          fi

          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue

            echo "Deleting old Docker Hub tag: ${TAG}"

            curl \
              --fail \
              --silent \
              --show-error \
              --request DELETE \
              --header "Authorization: Bearer ${TOKEN}" \
              "https://hub.docker.com/v2/namespaces/${DOCKERHUB_USERNAME}/repositories/${IMAGE_NAME}/tags/${TAG}"

          done <<< "$OLD_TAGS"

          echo "Docker Hub cleanup completed."


      # ---------------------------------------------------------
      # CLEANUP BUILD CACHE
      # ---------------------------------------------------------

      - name: Cleanup build cache
        run: |
          docker builder prune \
            -f \
            --filter "until=24h"


      # ---------------------------------------------------------
      # REMOVE TEMPORARY ENV
      # ---------------------------------------------------------

      - name: Remove temporary environment
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/.env"


      # ---------------------------------------------------------
      # FAILURE LOGS
      # ---------------------------------------------------------

      - name: Show application logs on failure
        if: failure()
        run: |
          echo "================ JUSTIX AUTO ================"

          docker compose ps || true

          docker compose logs \
            --tail=150 \
            api \
            migrate || true
